services:
  kevbox:
    build: .
    container_name: kevbox
    restart: unless-stopped
    ports:
      - 127.0.0.1:3127:3000
    env_file:
      - .env
    environment:
      # The host has no IPv6 egress, but containers get a link-local IPv6 so
      # getaddrinfo returns AAAA records; Node's fetch then tries the IPv6
      # address first and HANGS until timeout (addons error with EAI_AGAIN /
      # "aborted due to timeout"). Force IPv4-first resolution so upstream
      # addon + metadata fetches connect immediately.
      - NODE_OPTIONS=--dns-result-order=ipv4first
      - KEVBOX_MEMBERS_FILE=/app/kevbox-shared/members.json
    depends_on:
      - stremthru
    volumes:
      - ./data:/app/data
      # The upstream Dockerfile's distroless stage never copies the template
      # into the image (WORKDIR /app, dist-only) — without this mount every
      # kevbox URL fails in production. Bind-mounting also means template
      # edits apply via the mtime cache without an image rebuild.
      - ./kevbox.config.json:/app/kevbox.config.json:ro
      # Shared dir written by kevbox-admin (members.json). MUST be the DIRECTORY, not
      # the single file: kevbox-admin replaces members.json via atomic rename, which
      # swaps the inode — a single-file bind-mount would pin the old inode and the mtime
      # cache would never see updates. Read-only here (the container only reads).
      - /var/lib/kevbox-shared:/app/kevbox-shared:ro
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

  # Self-hosted StremThru: the builtin debrid client (Zilean/Prowlarr Premiumize
  # cache-checks + link generation) goes through this instead of the public
  # instance (https://stremthru.13377001.xyz), removing a ~0.44s-per-round-trip
  # public hop + shared rate limits. Pointed at by BUILTIN_STREMTHRU_URL in .env
  # (http://stremthru:8080). Content-proxy OFF so it returns DIRECT Premiumize
  # links (portable, matches the no-MediaFlow setup) — StremThru stays API-only
  # and never sits in the playback path, so the internal URL is fine.
  # Standalone: SQLite in /app/data, Redis not required, no STREMTHRU_STORE_AUTH
  # (AIOStreams passes the family member's Premiumize token per request).
  stremthru:
    image: muniftanjim/stremthru:latest
    container_name: stremthru
    restart: unless-stopped
    environment:
      - "STREMTHRU_STORE_CONTENT_PROXY=*:false"
      # We use StremThru ONLY as a Premiumize store proxy (checkMagnet +
      # generateLink). Disable its indexer importers — left on, imdb_title
      # downloads the full IMDb dataset and dmm_hashlist the DMM lists (~GBs,
      # duplicating Zilean, scraping from the VPS IP). The store-proxy API is
      # core and unaffected.
      - "STREMTHRU_FEATURE=-imdb_title,-dmm_hashlist"
      - STREMTHRU_LOG_LEVEL=INFO
    volumes:
      - stremthru-data:/app/data
    ports:
      - 127.0.0.1:8080:8080   # debug via SSH tunnel; kevbox uses http://stremthru:8080
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    restart: unless-stopped
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
    volumes:
      - prowlarr-config:/config
    ports:
      - 127.0.0.1:9696:9696   # UI/API via SSH tunnel only; kevbox uses http://prowlarr:9696
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

  zilean:
    image: ipromknight/zilean:v3.5.0
    container_name: zilean
    restart: unless-stopped
    mem_limit: 3g          # DMM import spikes ~2 GiB RSS; a contained OOM restarts + resumes
    tty: true
    environment:
      Zilean__Database__ConnectionString: "Host=zilean-postgres;Port=5432;Database=zilean;Username=postgres;Password=${ZILEAN_POSTGRES_PASSWORD};Include Error Detail=true;Timeout=30;CommandTimeout=3600;"
      Zilean__Dmm__EnableScraping: "true"
      Zilean__Torznab__EnableEndpoint: "true"      # AIOStreams' zilean preset consumes <url>/torznab/api
      Zilean__Imdb__EnableImportMatching: "true"   # required: AIOStreams prefers imdbid= torznab searches
      Zilean__Imdb__UseLucene: "false"             # true would cost ~3 GB extra RAM during resyncs
      Zilean__Imdb__UseAllCores: "false"
      Zilean__Imdb__NumberOfCores: "2"
      Zilean__EnableDashboard: "false"
    volumes:
      - zilean-data:/app/data
      - zilean-tmp:/tmp
    ports:
      - 127.0.0.1:8181:8181   # ops/debug via SSH tunnel; kevbox uses http://zilean:8181
    healthcheck:
      test: curl --connect-timeout 10 --silent --show-error --fail http://localhost:8181/healthchecks/ping
      timeout: 60s
      interval: 30s
      retries: 10
    depends_on:
      zilean-postgres:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

  zilean-postgres:
    image: postgres:17-alpine
    container_name: zilean-postgres
    restart: unless-stopped
    mem_limit: 2g
    shm_size: 2g           # upstream compose value; tmpfs is lazily allocated (costs nothing idle)
    environment:
      PGDATA: /var/lib/postgresql/data/pgdata
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${ZILEAN_POSTGRES_PASSWORD}
      POSTGRES_DB: zilean
    volumes:
      - zilean-postgres-data:/var/lib/postgresql/data/pgdata
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

volumes:
  prowlarr-config:
  zilean-data:
  zilean-tmp:
  zilean-postgres-data:
  stremthru-data:

networks:
  default:
    ipam:
      config:
        # Pinned so TRUSTED_IPS (.env) can cover it: the app only honors
        # X-Forwarded-For from trusted subnets, and the default trust list
        # covers docker0 (172.17.0.0/16) but not compose project networks.
        # Without this, every client shares one rate-limit bucket.
        - subnet: 172.30.0.0/16
