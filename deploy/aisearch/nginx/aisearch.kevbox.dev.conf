# Kevbox — "AI Search" self-hosted Stremio addon.
# HTTP-only seed; TLS injected by:  sudo certbot --nginx -d aisearch.kevbox.dev
# Mirrors streams.kevbox.dev (native nginx + certbot on the box, NOT Caddy).
# Install target has NO extension: /etc/nginx/sites-available/aisearch.kevbox.dev
server {
    server_name aisearch.kevbox.dev;

    # The install / manifest URL path carries each user's ENCRYPTION_KEY-encrypted
    # config blob (which wraps their OpenRouter/TMDB keys) — never log paths.
    access_log off;

    # Stremio manifests grow to a few KB once catalogs are configured.
    proxy_read_timeout 60s;

    location / {
        proxy_pass http://127.0.0.1:7000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen 80;
    listen [::]:80;
}
