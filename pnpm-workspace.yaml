packages:
  - packages/*

allowBuilds:
  bcrypt: true
  better-sqlite3: true
  core-js: true
  esbuild: true
  sharp: true
  sqlite3: true
  unrs-resolver: true

patchedDependencies:
  stremthru: patches/stremthru.patch

# Security floors for packages pulled in by other dependencies, which still
# ask for releases with published advisories.
overrides:
  '@torbox/torbox-api>zod': ^3.25.76
  brace-expansion@>=2.0.0 <2.1.7: ^2.1.7
  fast-copy@<4.1.0: ^4.3.0
  ip-address@<10.7.4: ^10.7.5
  js-cookie@<3.0.6: ^3.0.8
  undici@>=7.0.0 <7.30.1: ^7.30.1
